<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/cadastro.css">
    <title>Cadastro MemeLog</title>
</head>

<body>
    <div class="topo">
        <img id="icon" src="img/memelogicon.png" width="200px">
        <h2 class="memelogcadastro">MemeLog</h2>
    </div>
    <form id="form-cadastro" action="cadastro.php" method="post">
        <input type="text" name="nome" placeholder="Nome" required>
        <input type="text" name="sobrenome" placeholder="Sobrenome" required>
        <p id="emailerro"></p>
        <input id="emailcadastro" type="email" name="email" placeholder="Email" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" required>
        <button onclick="testeUsuario()" id="btn-cdt" type="submit">Cadastrar</button>
        <p id="jaPossuiconta">Já possui uma conta? <a href="login.html">Clique aqui</a></p>


    </form>

    <script src="/scripts/main.js"></script>

</body>

</html>
